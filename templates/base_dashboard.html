{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <aside class="app-sidebar">
    <div>
      <div class="app-brand">PAPER STUDIO</div>
      <div class="app-role">{% block role %}{% endblock %}</div>
      <nav class="app-nav">{% block nav %}{% endblock %}</nav>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">{{ request.user.get_full_name|default:request.user.username }}</div>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="logout-link">Log out</button>
      </form>
    </div>
  </aside>
  <main class="app-main">{% block content %}{% endblock %}</main>
</div>
{% endblock %}
