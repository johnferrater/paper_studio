{% extends "base.html" %}
{% block title %}Sign in · Paper Studio{% endblock %}
{% block body %}
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <form method="post" class="card p-4 shadow-sm w-100" style="max-width: 400px;">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <h1 class="h4 mb-1" style="color: var(--navy);">Sign in</h1>
    <p class="text-secondary small mb-4">Use your paper_studio account.</p>
    {% if form.errors %}
      <div class="alert alert-danger py-2" role="alert">Incorrect username or password.</div>
    {% endif %}
    <label for="id_username" class="form-label">Username</label>
    <input type="text" name="username" id="id_username" class="form-control mb-3" required autofocus>
    <label for="id_password" class="form-label">Password</label>
    <input type="password" name="password" id="id_password" class="form-control mb-4" required>
    <button type="submit" class="btn btn-primary w-100">Sign in</button>
  </form>
</div>
{% endblock %}
