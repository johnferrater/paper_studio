{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Paper Studio{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0B1F3A',
            accent: { DEFAULT: '#5B3FD6', dark: '#4B31B8', soft: '#E9E4FB' },
            canvas: '#F5F7FA',
            ink: '#0B1F3A',
            muted: '#5A6B85',
            line: '#E3E8F0',
            success: { DEFAULT: '#12805C', soft: '#DCF3E7' },
            warning: { DEFAULT: '#93650A', soft: '#FDF0D5' },
            info: { DEFAULT: '#1D5FD1', soft: '#DCE9FB' },
            danger: { DEFAULT: '#B42318', soft: '#FCE4E2' }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
